[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projector-companion"
version = "0.1.0"
description = "Contracts and independent stages for a physical AI projector companion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
companion = "companion.app:main"

[tool.setuptools.packages.find]
where = ["src"]
