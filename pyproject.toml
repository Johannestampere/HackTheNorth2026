[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projector-companion"
version = "0.1.0"
description = "Contracts and independent stages for a physical AI projector companion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
planning = ["pooltool-billiards==0.6.0"]
# Perception reads real images; the core contracts stay dependency-free.
# The CNN that classifies stripe-vs-solid is optional on top of this - the
# detector falls back to its rim measurement when torch is absent.
perception = ["opencv-contrib-python>=4.7", "numpy>=1.24"]
# The local stripe/solid CNN. Optional on top of perception: without it the
# detector falls back to its rim measurement.
perception-cnn = ["torch>=2.0"]
# tools/shot_demo.py only - plotting is not needed by any stage.
demo = ["matplotlib>=3.7"]

[project.scripts]
companion = "companion.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"companion.pool.planning" = ["replay.html"]
"companion.pool.perception.vision.classify.net" = ["ball_kinds.pt"]
